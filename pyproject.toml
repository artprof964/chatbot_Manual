[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manual-knowledge"
version = "0.1.0"
description = "Deterministic local evidence bundles for a manual knowledge service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
manual-knowledge = "manual_knowledge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
